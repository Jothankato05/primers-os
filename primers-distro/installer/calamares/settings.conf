# PRIMERS OS — Calamares installer (calamares 3.2.x, Ubuntu 22.04 base)
# Installed to /etc/calamares by build.sh. Module configuration lives in
# modules/<name>.conf next to this file.
---
modules-search: [ local ]

instances:
  - id: cleanup
    module: shellprocess
    config: shellprocess-cleanup.conf
  - id: finalize
    module: shellprocess
    config: shellprocess-finalize.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - shellprocess@cleanup
      - packages
      - shellprocess@finalize
      - luksbootkeyfile
      - users
      - networkcfg
      - hwclock
      - services-systemd
      - displaymanager
      - initramfscfg
      - initramfs
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: primers
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
