---
# Remove live-session-only files from the target before user accounts are
# created (users are populated from /etc/skel).
dontChroot: false
timeout: 60
script:
  - "-rm -f /usr/share/applications/install-primers.desktop"
  - "-rm -f /etc/skel/Desktop/install-primers.desktop"
  - "-rmdir --ignore-fail-on-non-empty /etc/skel/Desktop"
  - "-rm -f /etc/casper.conf"
  - "-rm -f /etc/sudoers.d/casper"
