---
efiBootLoader: "grub"
kernel: "/vmlinuz"
img: "/initrd.img"
fallback: "/initrd.img.old"
timeout: "5"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
# Ubuntu's Secure-Boot-signed GRUB looks for its config in EFI/ubuntu,
# so the EFI directory must keep that name.
efiBootloaderId: "ubuntu"
installEFIFallback: true
