---
overwrite: false
keepDistributor: true
prefer_grub_d: false
defaults:
  # No boot menu wait (docs/benchmarks.md); shown for 10 s when another
  # system is on the disk (Ubuntu's os-prober script), Shift/Esc otherwise
  GRUB_TIMEOUT_STYLE: "hidden"
  GRUB_TIMEOUT: 0
  GRUB_RECORDFAIL_TIMEOUT: 10
  GRUB_DEFAULT: "0"
  GRUB_DISABLE_SUBMENU: true
  GRUB_TERMINAL_OUTPUT: "gfxterm"
  GRUB_DISABLE_RECOVERY: false
