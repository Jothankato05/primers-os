---
defaultGroups:
  - adm
  - audio
  - cdrom
  - dip
  - plugdev
  - users
  - video
  - name: sudo
    must_exist: true
    system: true

autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false

passwordRequirements:
  nonempty: true
  minLength: 6
  maxLength: -1
allowWeakPasswords: false
allowWeakPasswordsDefault: false

userShell: /bin/bash

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${first}-primers"
  forbidden_names: [ localhost ]
