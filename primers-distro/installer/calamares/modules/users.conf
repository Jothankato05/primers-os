---
defaultGroups:
  - adm
  - audio
  - cdrom
  - dip
  - plugdev
  - users
  - video
  - name: sudo
    must_exist: true
    system: true

autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false

passwordRequirements:
  nonempty: true
  minLength: 6
  maxLength: -1
allowWeakPasswords: false
allowWeakPasswordsDefault: false

userShell: /bin/bash
user:
  shell: /bin/bash
  # Login names the system already uses as accounts or groups (useradd would
  # fail at the very end of the install, e.g. "staff" is a group) and "lab",
  # the Lab Mode account
  forbidden_names: [ root, nobody, daemon, bin, sys, sync, games, man, lp, mail, news, uucp,
                     proxy, www-data, backup, list, irc, gnats, staff, users, adm, sudo, admin,
                     audio, video, cdrom, dip, plugdev, netdev, lpadmin, sambashare, lightdm,
                     systemd-network, systemd-resolve, messagebus, syslog, lab, primers ]

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${first}-primers"
  forbidden_names: [ localhost ]
