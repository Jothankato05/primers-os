# PRIMERS OS — ISO build configuration
# Sourced by build.sh. Every value can be overridden from the environment,
# e.g.  MIRROR=http://mirror.example/ubuntu sudo -E ./build.sh

PRIMERS_NAME="${PRIMERS_NAME:-PRIMERS OS}"
PRIMERS_VERSION="${PRIMERS_VERSION:-1.0}"
PRIMERS_CODENAME="${PRIMERS_CODENAME:-Genesis}"

# Ubuntu base
SUITE="${SUITE:-jammy}"
ARCH="${ARCH:-amd64}"
MIRROR="${MIRROR:-http://archive.ubuntu.com/ubuntu}"
SECURITY_MIRROR="${SECURITY_MIRROR:-http://security.ubuntu.com/ubuntu}"
COMPONENTS="${COMPONENTS:-main restricted universe multiverse}"

# Kernel: the HWE kernel supports far more recent hardware (GPUs, Wi-Fi)
# than the 22.04 GA kernel, which matters for a gaming-focused desktop.
KERNEL_PACKAGE="${KERNEL_PACKAGE:-linux-generic-hwe-22.04}"

# Live session
LIVE_USER="${LIVE_USER:-primers}"
LIVE_USER_FULLNAME="${LIVE_USER_FULLNAME:-PRIMERS Live User}"
LIVE_HOSTNAME="${LIVE_HOSTNAME:-primers-os}"

# Output
ISO_NAME="${ISO_NAME:-primers-os-1.0-genesis-amd64.iso}"
ISO_VOLUME="${ISO_VOLUME:-PRIMERS_OS_1_0}"

# squashfs compression: xz is smallest, zstd is much faster to build and boot.
SQUASHFS_COMP="${SQUASHFS_COMP:-xz}"
