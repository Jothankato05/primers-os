# PRIMERS OS: a small system journal. Opening and writing it at boot
# (systemd-journal-flush) is in the way of the login screen on hard disks
# (docs/benchmarks.md). The exam evidence is kept in its own durable log,
# /var/log/primers/exam.jsonl (ADR 0004), not here; the privacy retention
# limit (90-primers-retention.conf) still applies.
[Journal]
SystemMaxUse=200M
SystemMaxFileSize=16M
