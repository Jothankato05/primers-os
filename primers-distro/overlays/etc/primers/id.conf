# PRIMERS OS: which Primers ID service signs people in (OpenID Connect).
# Changing provider (a test one, a campus one, the live Primers ID service)
# is a change to this file only. See docs/primers-id.md.
[primers-id]
# The provider's issuer: its /.well-known/openid-configuration must be here
issuer = https://id.primersgroup.ng
# This OS's client ID at the provider (a public client: no secret)
client_id = primers-os
scopes = openid profile email
# How many days after the last online sign-in the offline PIN still works
offline_days = 14
