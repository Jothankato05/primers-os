name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  brain-tests:
    name: Brain tests (Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is what ships in PRIMERS OS (Ubuntu 22.04)
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r primers-os/requirements-dev.txt
      - name: The image's cryptography on its Python (3.10 gets 3.4.8, as Ubuntu 22.04 ships)
        if: matrix.python == '3.10'
        run: python -m pip install "cryptography==3.4.8"
      - name: Byte-compile (catches syntax the target Python can't parse)
        run: python -m compileall -q primers-os
      - name: Run tests
        working-directory: primers-os
        run: python -m pytest -q tests
      - name: One-shot smoke test
        working-directory: primers-os
        env:
          PRIMERS_DATA_DIR: ${{ runner.temp }}/primers
        run: |
          python main.py --version
          python main.py -c "math 2^10" | grep -q "1,024"
          python main.py -c "status" -c "advise"

  lite-bee:
    name: Primers Lite Bee
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK, WebKit and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.0 python3-pytest xvfb xdotool
      - name: Unit tests
        working-directory: primers-lite-bee
        run: /usr/bin/python3 -m pytest -q tests
      - name: Browser smoke test (real WebKit, Ultra mode blocks images)
        timeout-minutes: 5
        working-directory: primers-lite-bee
        env:
          LITEBEE_HOME: ${{ runner.temp }}/litebee
        run: |
          mkdir -p "$RUNNER_TEMP/www"
          head -c 400000 /dev/urandom > "$RUNNER_TEMP/www/photo.jpg"
          printf '<title>t</title><h1>Hello</h1><img src="photo.jpg">' > "$RUNNER_TEMP/www/index.html"
          (cd "$RUNNER_TEMP/www" && python3 -m http.server 8765 --bind 127.0.0.1 &)
          sleep 1
          xvfb-run -a ./lite-bee --screenshot "$RUNNER_TEMP/home.png" bee:home | tee home.json
          grep -q '"title": "Primers Lite Bee"' home.json
          xvfb-run -a ./lite-bee --mode ultra --screenshot "$RUNNER_TEMP/ultra.png" http://127.0.0.1:8765/ | tee ultra.out
          grep '^{' ultra.out | tail -n1 > ultra.json
          python3 -c "import json; d=json.load(open('ultra.json')); assert d['mode']=='ultra' and d['bytes'] < 5000, d; print('Ultra mode page bytes:', d['bytes'])"
      - name: Exam kiosk smoke test (only the exam server loads)
        timeout-minutes: 5
        working-directory: primers-lite-bee
        env:
          LITEBEE_HOME: ${{ runner.temp }}/litebee-kiosk
          PRIMERS_EXAM_CONF: ${{ runner.temp }}/exam.conf
        run: |
          # The exam page tries to leave for a server that isn't on the list
          printf '<title>Exam</title><h1>Question 1</h1><script>setTimeout(function(){location.href="http://localhost:8765/index.html"},100)</script>' > "$RUNNER_TEMP/www/exam.html"
          printf 'EXAM_URL=http://127.0.0.1:8765/exam.html\nALLOW=127.0.0.1\nPORTS=80,443,8765\n' > "$PRIMERS_EXAM_CONF"
          xvfb-run -a ./lite-bee --kiosk --screenshot "$RUNNER_TEMP/kiosk.png" | tee kiosk.out
          grep '^{' kiosk.out | tail -n1 > kiosk.json
          python3 -c "import json; d=json.load(open('kiosk.json')); assert d['kiosk'] and d['title'] == 'Exam' and d['blocked'] >= 1 and d['uri'].startswith('http://127.0.0.1:8765/'), d; print('kiosk:', d)"
          rm "$PRIMERS_EXAM_CONF"
          if ./lite-bee --kiosk; then echo "kiosk must refuse to start without an exam"; exit 1; fi
      - name: Exam site probe (records every server and port an exam site uses)
        working-directory: primers-lite-bee
        timeout-minutes: 5
        env:
          HOME: ${{ runner.temp }}/probe-home
        run: |
          mkdir -p "$HOME"
          python3 tests/probe/serve.py 120 &
          Xvfb :92 -screen 0 1280x800x24 &
          export DISPLAY=:92
          sleep 2
          ./lite-bee --probe http://127.0.0.1:8767/probe.html --probe-report "$RUNNER_TEMP/probe.json" --probe-seconds 15
          python3 tests/probe/check_probe.py "$RUNNER_TEMP/probe.json"
      - name: Exam kiosk escape routes (dev tools, view-source, file, data, windows, print, downloads, keys)
        working-directory: primers-lite-bee
        timeout-minutes: 5
        env:
          LITEBEE_HOME: ${{ runner.temp }}/litebee-escape
          HOME: ${{ runner.temp }}/escape-home
          PRIMERS_EXAM_CONF: ${{ runner.temp }}/exam-escape.conf
        run: |
          mkdir -p "$HOME" "$RUNNER_TEMP/www-escape"
          cp tests/kiosk/escape.html "$RUNNER_TEMP/www-escape/"
          printf '<title>page 2</title>' > "$RUNNER_TEMP/www-escape/page2.html"
          head -c 50000 /dev/urandom > "$RUNNER_TEMP/www-escape/blob.bin"
          (cd "$RUNNER_TEMP/www-escape" && python3 -m http.server 8766 --bind 127.0.0.1 &)
          printf 'EXAM_URL=http://127.0.0.1:8766/escape.html\nALLOW=127.0.0.1\nPORTS=80,443,8766\n' > "$PRIMERS_EXAM_CONF"
          Xvfb :91 -screen 0 1280x800x24 &
          export DISPLAY=:91
          sleep 2
          ./lite-bee --kiosk --selftest 25 > escape.out 2>&1 &
          kiosk=$!
          sleep 10
          for k in F12 ctrl+shift+i ctrl+shift+j ctrl+u ctrl+p ctrl+s ctrl+o ctrl+n ctrl+t ctrl+w ctrl+q ctrl+l F11 F7 ctrl+shift+p; do
            xdotool key "$k"; sleep 0.4
          done
          wait "$kiosk"
          python3 tests/kiosk/check_escape.py escape.out "$HOME"

  distro-lint:
    name: Distro lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y shellcheck qtdeclarative5-dev-tools python3-yaml
      - name: shellcheck
        working-directory: primers-distro
        run: |
          shellcheck -S warning -s bash build.sh clean.sh \
            config/hooks/chroot/*.hook.chroot \
            overlays/usr/bin/primers overlays/usr/bin/primers-compat \
            overlays/usr/bin/primers-install overlays/usr/bin/primers-terminal \
            overlays/etc/skel/.config/openbox/autostart ../primers-lite-bee/lite-bee \
            overlays/usr/lib/primers/unmetered-network overlays/usr/bin/primers-lab \
            overlays/usr/bin/primers-study overlays/usr/lib/primers/study-panel \
            overlays/usr/bin/primers-exam overlays/usr/lib/primers/exam-session \
            overlays/etc/X11/Xsession.d/98primers-exam overlays/usr/lib/primers/exam-shell \
            tools/release-notes.sh tools/check-image-perms.sh tools/check-iso-perms.sh \
            tests/test-image-perms.sh tests/vm/install.sh \
            overlays/usr/lib/primers/installer/sfdisk tests/test-installer-sfdisk.sh \
            tests/cbt/moodle/setup.sh tests/cbt/tcexam/setup.sh overlays/usr/bin/primers-fleet \
            overlays/etc/initramfs-tools/hooks/primers-trim
      - name: Image permission gate (owners and modes of what goes into the image)
        run: sudo primers-distro/tests/test-image-perms.sh
      - name: Installer sfdisk correction (fake sfdisk, and a real GPT disk on a loop device)
        run: sudo primers-distro/tests/test-installer-sfdisk.sh
      - name: VM test harness compiles
        run: python3 -m py_compile primers-distro/tests/vm/*.py
      - name: Validate JSON, YAML, XML and QML
        working-directory: primers-distro
        run: |
          python3 -c "import json; json.load(open('overlays/usr/lib/primers/modules/module_registry.json'))"
          python3 - <<'EOF'
          import glob, yaml, xml.dom.minidom
          for f in ["installer/calamares/settings.conf", "installer/calamares/branding/primers/branding.desc",
                    *glob.glob("installer/calamares/modules/*.conf")]:
              yaml.safe_load(open(f))
          for f in glob.glob("overlays/etc/skel/.config/openbox/*.xml") + glob.glob("overlays/usr/share/primers/exam/*.xml"):
              xml.dom.minidom.parse(f)
          print("configs OK")
          EOF
          /usr/lib/qt5/bin/qmllint installer/calamares/branding/primers/show.qml
      - name: Every package exists in Ubuntu 22.04
        run: python3 primers-distro/tools/check-packages.py
