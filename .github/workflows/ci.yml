name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  brain-tests:
    name: Brain tests (Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is what ships in PRIMERS OS (Ubuntu 22.04)
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r primers-os/requirements-dev.txt
      - name: Byte-compile (catches syntax the target Python can't parse)
        run: python -m compileall -q primers-os
      - name: Run tests
        working-directory: primers-os
        run: python -m pytest -q tests
      - name: One-shot smoke test
        working-directory: primers-os
        env:
          PRIMERS_DATA_DIR: ${{ runner.temp }}/primers
        run: |
          python main.py --version
          python main.py -c "math 2^10" | grep -q "1,024"
          python main.py -c "status" -c "advise"

  lite-bee:
    name: Primers Lite Bee
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK, WebKit and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.0 python3-pytest xvfb
      - name: Unit tests
        working-directory: primers-lite-bee
        run: /usr/bin/python3 -m pytest -q tests
      - name: Browser smoke test (real WebKit, Ultra mode blocks images)
        working-directory: primers-lite-bee
        env:
          LITEBEE_HOME: ${{ runner.temp }}/litebee
        run: |
          mkdir -p "$RUNNER_TEMP/www"
          head -c 400000 /dev/urandom > "$RUNNER_TEMP/www/photo.jpg"
          printf '<title>t</title><h1>Hello</h1><img src="photo.jpg">' > "$RUNNER_TEMP/www/index.html"
          (cd "$RUNNER_TEMP/www" && python3 -m http.server 8765 --bind 127.0.0.1 &)
          sleep 1
          xvfb-run -a ./lite-bee --screenshot "$RUNNER_TEMP/home.png" bee:home | tee home.json
          grep -q '"title": "Primers Lite Bee"' home.json
          xvfb-run -a ./lite-bee --mode ultra --screenshot "$RUNNER_TEMP/ultra.png" http://127.0.0.1:8765/ | tee ultra.out
          grep '^{' ultra.out | tail -n1 > ultra.json
          python3 -c "import json; d=json.load(open('ultra.json')); assert d['mode']=='ultra' and d['bytes'] < 5000, d; print('Ultra mode page bytes:', d['bytes'])"

  distro-lint:
    name: Distro lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y shellcheck qtdeclarative5-dev-tools python3-yaml
      - name: shellcheck
        working-directory: primers-distro
        run: |
          shellcheck -S warning -s bash build.sh clean.sh \
            config/hooks/chroot/*.hook.chroot \
            overlays/usr/bin/primers overlays/usr/bin/primers-compat \
            overlays/usr/bin/primers-install overlays/usr/bin/primers-terminal \
            overlays/etc/skel/.config/openbox/autostart ../primers-lite-bee/lite-bee
      - name: Validate JSON, YAML, XML and QML
        working-directory: primers-distro
        run: |
          python3 -c "import json; json.load(open('overlays/usr/lib/primers/modules/module_registry.json'))"
          python3 - <<'EOF'
          import glob, yaml, xml.dom.minidom
          for f in ["installer/calamares/settings.conf", "installer/calamares/branding/primers/branding.desc",
                    *glob.glob("installer/calamares/modules/*.conf")]:
              yaml.safe_load(open(f))
          for f in glob.glob("overlays/etc/skel/.config/openbox/*.xml"):
              xml.dom.minidom.parse(f)
          print("configs OK")
          EOF
          /usr/lib/qt5/bin/qmllint installer/calamares/branding/primers/show.qml
      - name: Every package exists in Ubuntu 22.04
        run: python3 primers-distro/tools/check-packages.py
