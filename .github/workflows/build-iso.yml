name: Build and Release PRIMERS OS ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space (the build needs ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso mtools \
            grub-pc-bin grub-efi-amd64-bin grub-common gnupg curl

      - name: Check package names
        run: python3 primers-distro/tools/check-packages.py

      - name: Build ISO
        run: sudo PRIMERS_WORK_DIR=/mnt/primers-work ./primers-distro/build.sh

      - name: Prepare release files
        id: files
        run: |
          cd primers-distro
          ISO=$(ls *.iso | head -n1)
          SIZE=$(stat -c %s "$ISO")
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"
          echo "ISO size: $SIZE bytes"
          # GitHub release assets are limited to 2 GiB per file
          if [ "$SIZE" -ge 2000000000 ]; then
            split -b 1900M -d -a 1 "$ISO" "$ISO.part"
            sha256sum "$ISO".part* > "$ISO.parts.sha256"
            echo "split=true" >> "$GITHUB_OUTPUT"
          else
            echo "split=false" >> "$GITHUB_OUTPUT"
          fi
          ls -la

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.files.outputs.iso }}
          path: |
            primers-distro/*.iso
            primers-distro/*.sha256
          compression-level: 0
          retention-days: 14

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PRIMERS OS ${{ github.ref_name }}"
          files: |
            ${{ steps.files.outputs.split == 'true' && format('primers-distro/{0}.part*', steps.files.outputs.iso) || format('primers-distro/{0}', steps.files.outputs.iso) }}
            primers-distro/*.sha256
          body: |
            ## PRIMERS OS 1.0 Genesis

            - Base: Ubuntu 22.04 LTS (HWE kernel)
            - Desktop: Openbox + tint2, PRIMERS Brain on login
            - Installer: Calamares (BIOS and UEFI)
            - Windows apps: Wine · Games: Lutris, GameMode, MangoHud

            ${{ steps.files.outputs.split == 'true' && 'The ISO is larger than GitHub''s 2 GiB asset limit, so it is split. Join the parts, then verify:' || 'Verify the download:' }}

            ```bash
            ${{ steps.files.outputs.split == 'true' && format('cat {0}.part* > {0}', steps.files.outputs.iso) || '' }}
            sha256sum -c ${{ steps.files.outputs.iso }}.sha256
            ```

            **Install:** write the ISO to a USB stick (balenaEtcher, Rufus in DD mode, or
            `sudo dd if=<iso> of=/dev/sdX bs=4M status=progress`), boot from it and
            double-click **Install PRIMERS OS**. Secure Boot must be disabled to boot the
            live USB.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
