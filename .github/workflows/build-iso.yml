name: Build and Release PRIMERS OS ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: "Publish a PRE-release with this tag (e.g. v1.0.0-rc2), built from the selected branch. Empty: build and test only."
        required: false
        default: ""
      reuse_run_id:
        description: "With a pre-release tag: publish the signed ISO an earlier run of this workflow built (its run ID) instead of building again."
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    if: ${{ !github.event.inputs.reuse_run_id }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: write
      id-token: write     # Sigstore keyless signing of SHA256SUMS (no key stored anywhere)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.prerelease_tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            # A run started by hand may only publish a pre-release (v1.2.3-something)
            if ! printf '%s' "$INPUT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$'; then
              echo "::error::'$INPUT_TAG' is not a pre-release tag like v1.0.0-rc2; final releases are tagged by hand"
              exit 1
            fi
            tag="$INPUT_TAG"
          else
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag:-none (build only)}"

      - name: Free disk space (the build needs ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso mtools gnupg curl

      - name: Check package names
        run: python3 primers-distro/tools/check-packages.py

      - name: Build ISO
        run: sudo PRIMERS_WORK_DIR=/mnt/primers-work ./primers-distro/build.sh

      - name: Image owners and permissions (the finished ISO; a failure stops the release)
        run: primers-distro/tools/check-iso-perms.sh "$(ls primers-distro/*.iso | head -n1)"

      - name: Enable KVM for the VM tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get install -y qemu-system-x86 ovmf python3-pil
          ls -l /dev/kvm

      - name: PHP for the CBT test servers (TCExam 17 needs PHP 8.2+, Ubuntu 22.04 has 8.1)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql, intl, zip, gd, mbstring, xml, curl, soap, sodium, bcmath, exif
          tools: composer
          coverage: none

      - name: CBT test servers (a real Moodle and TCExam on this machine, for the VM tests)
        timeout-minutes: 30
        run: |
          sudo systemctl start postgresql.service
          sudo mkdir -p /mnt/cbt
          out=$(sudo bash primers-distro/tests/cbt/moodle/setup.sh /mnt/cbt)
          echo "$out"
          echo "MOODLE_CMID=$(sed -n 's/^CMID=//p' <<<"$out")" >> "$GITHUB_ENV"
          out=$(sudo bash primers-distro/tests/cbt/tcexam/setup.sh /mnt/cbt)
          echo "$out"
          echo "TCEXAM_TESTID=$(sed -n 's/^TESTID=//p' <<<"$out")" >> "$GITHUB_ENV"

      - name: VM tests (the image itself, booted; a failure stops the release)
        timeout-minutes: 150
        run: |
          iso=$(ls primers-distro/*.iso | head -n1)
          rc=0
          python3 primers-distro/tests/vm/run_vm_tests.py exam-escape --iso "$iso" --out vm-results/exam-escape || rc=1
          # Installs on a VM disk, cuts its power mid-exam, checks it comes back locked (ADR 0004)
          python3 primers-distro/tests/vm/run_vm_tests.py exam-power-cut --iso "$iso" --out vm-results/exam-power-cut || rc=1
          # Real exam sites: the probe, a CDN that moves during the exam, an IPv6-only exam server
          PRIMERS_VM_REQUIRE_IPV6=1 python3 primers-distro/tests/vm/run_vm_tests.py exam-network --iso "$iso" --out vm-results/exam-network || rc=1
          # Real CBT platforms, self-hosted here: a Moodle quiz and a TCExam test, each found with
          # the probe, started with its command and taken in the kiosk from sign-in to submission
          python3 primers-distro/tests/vm/run_vm_tests.py exam-moodle --iso "$iso" --out vm-results/exam-moodle || rc=1
          python3 primers-distro/tests/vm/run_vm_tests.py exam-tcexam --iso "$iso" --out vm-results/exam-tcexam || rc=1
          # Installed systems: legacy BIOS, and UEFI with Secure Boot enforced; Lab Mode
          # across restarts and the whole escape suite on each
          python3 primers-distro/tests/vm/run_vm_tests.py installed --firmware bios --iso "$iso" --out vm-results/installed-bios || rc=1
          python3 primers-distro/tests/vm/run_vm_tests.py installed --firmware sb --iso "$iso" --out vm-results/installed-sb || rc=1
          exit $rc

      - name: Upload VM test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-results
          path: vm-results/
          retention-days: 30

      - name: Checksums (SHA256SUMS)
        id: files
        working-directory: primers-distro
        run: |
          ISO=$(ls *.iso | head -n1)
          SIZE=$(stat -c %s "$ISO")
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"
          echo "ISO size: $SIZE bytes"
          files=("$ISO")
          # GitHub release assets are limited to 2 GiB per file
          if [ "$SIZE" -ge 2000000000 ]; then
            split -b 1900M -d -a 1 "$ISO" "$ISO.part"
            files+=("$ISO".part*)
            echo "split=true" >> "$GITHUB_OUTPUT"
          else
            echo "split=false" >> "$GITHUB_OUTPUT"
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign SHA256SUMS (Sigstore keyless, this workflow's GitHub identity)
        working-directory: primers-distro
        run: |
          cosign sign-blob --yes --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem SHA256SUMS
          # Check the signature the way users will, before anything is published
          cosign verify-blob SHA256SUMS --signature SHA256SUMS.sig --certificate SHA256SUMS.pem \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-iso.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.files.outputs.iso }}
          path: |
            primers-distro/*.iso
            primers-distro/SHA256SUMS*
          compression-level: 0
          retention-days: 14

      - name: Release notes
        if: steps.tag.outputs.tag != ''
        env:
          ISO: ${{ steps.files.outputs.iso }}
          SPLIT: ${{ steps.files.outputs.split }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          primers-distro/tools/release-notes.sh "$TAG" "$ISO" "$SPLIT" \
            "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-iso.yml@${GITHUB_REF}" \
            "$GITHUB_SHA" > release-notes.md
          cat release-notes.md

      - name: Create release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          # When started by hand, the tag is created on the exact commit built here
          target_commitish: ${{ github.sha }}
          name: "PRIMERS OS ${{ steps.tag.outputs.tag }}"
          body_path: release-notes.md
          # Tags with a suffix (v1.0.0-rc1) are pre-releases. A final tag only
          # makes a draft: publishing a final release is a deliberate, manual step.
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          draft: ${{ !contains(steps.tag.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.files.outputs.split == 'true' && format('primers-distro/{0}.part*', steps.files.outputs.iso) || format('primers-distro/{0}', steps.files.outputs.iso) }}
            primers-distro/SHA256SUMS
            primers-distro/SHA256SUMS.sig
            primers-distro/SHA256SUMS.pem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish what an earlier run of this workflow built and signed, without
  # building again: the artifact is checked against the signature that run
  # made (Sigstore, that run's workflow identity) and the checksums inside it
  # before anything is published, and the release points at the commit that
  # run built.
  reuse:
    if: ${{ github.event.inputs.reuse_run_id }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: write     # create the release
      actions: read       # read the earlier run and download its artifact
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.inputs.reuse_run_id }}
      TAG: ${{ github.event.inputs.prerelease_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release tag
        id: tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$'; then
            echo "::error::reusing a run needs a pre-release tag like v1.0.0-rc2, not '$TAG'; final releases are tagged by hand"
            exit 1
          fi
          if ! printf '%s' "$RUN_ID" | grep -Eq '^[0-9]+$'; then
            echo "::error::'$RUN_ID' is not a run ID"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::tag $TAG already exists; a published tag is never moved"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check the earlier run
        id: run
        shell: bash
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          path=$(jq -r .path <<<"$run")
          repo=$(jq -r .repository.full_name <<<"$run")
          sha=$(jq -r .head_sha <<<"$run")
          branch=$(jq -r .head_branch <<<"$run")
          event=$(jq -r .event <<<"$run")
          echo "Run $RUN_ID: $repo $path, $event on $branch at $sha"
          if [ "$repo" != "$GITHUB_REPOSITORY" ] || [ "$path" != ".github/workflows/build-iso.yml" ]; then
            echo "::error::run $RUN_ID is not a run of this repository's build-iso.yml"
            exit 1
          fi
          case "$event" in
            workflow_dispatch) ref="refs/heads/$branch" ;;
            push) ref="refs/tags/$branch" ;;
            *) echo "::error::run $RUN_ID was started by '$event'"; exit 1 ;;
          esac
          # Every step that makes or checks the image must have passed; only
          # publishing may have failed
          steps=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name == "build") | .steps[] | "\(.conclusion)\t\(.name)"')
          printf '%s\n' "$steps"
          for need in "Build ISO" "Checksums (SHA256SUMS)" "Upload ISO artifact"; do
            grep -qxF "success"$'\t'"$need" <<<"$steps" || { echo "::error::step '$need' did not pass in run $RUN_ID"; exit 1; }
          done
          grep -q $'^success\tSign SHA256SUMS' <<<"$steps" || { echo "::error::SHA256SUMS was not signed in run $RUN_ID"; exit 1; }
          if grep -P '^(?!success|skipped)[^\t]*\tVM tests' <<<"$steps"; then
            echo "::error::the VM tests did not pass in run $RUN_ID"; exit 1
          fi
          bad=$(grep -P '^failure\t' <<<"$steps" | grep -vxP 'failure\tCreate release' || true)
          if [ -n "$bad" ]; then
            echo "::error::run $RUN_ID failed before publishing: $bad"; exit 1
          fi
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.expired == false and (.name | endswith(".iso")))][0].name // empty')
          if [ -z "$artifact" ]; then
            echo "::error::run $RUN_ID has no ISO artifact left (artifacts are kept 14 days)"; exit 1
          fi
          {
            echo "sha=$sha"
            echo "artifact=$artifact"
            echo "identity=https://github.com/$GITHUB_REPOSITORY/.github/workflows/build-iso.yml@$ref"
          } >> "$GITHUB_OUTPUT"

      - name: Download the earlier run's signed ISO
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.run.outputs.artifact }}
          path: release
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Check the signature and every checksum
        id: files
        shell: bash
        working-directory: release
        env:
          IDENTITY: ${{ steps.run.outputs.identity }}
        run: |
          ls -l
          cosign verify-blob SHA256SUMS --signature SHA256SUMS.sig --certificate SHA256SUMS.pem \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          ISO=$(ls *.iso)
          [ "$(printf '%s\n' "$ISO" | wc -l)" -eq 1 ] || { echo "::error::expected one ISO"; exit 1; }
          # Only the ISO and its parts, by plain names
          if grep -vqE "^[0-9a-f]{64}  ${ISO//./\\.}(\.part[0-9])?$" SHA256SUMS; then
            echo "::error::unexpected entries in SHA256SUMS"; exit 1
          fi
          if grep -q '\.part' SHA256SUMS; then
            split -b 1900M -d -a 1 "$ISO" "$ISO.part"
            echo "split=true" >> "$GITHUB_OUTPUT"
          else
            echo "split=false" >> "$GITHUB_OUTPUT"
          fi
          # Strict: every file in SHA256SUMS must be present and match
          sha256sum -c SHA256SUMS
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"

      - name: Image owners and permissions (an ISO built before this gate existed is checked too)
        env:
          ISO: ${{ steps.files.outputs.iso }}
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso
          primers-distro/tools/check-iso-perms.sh "release/$ISO"

      - name: Release notes
        env:
          ISO: ${{ steps.files.outputs.iso }}
          SPLIT: ${{ steps.files.outputs.split }}
          SHA: ${{ steps.run.outputs.sha }}
          IDENTITY: ${{ steps.run.outputs.identity }}
        run: |
          # The notes as they were in the commit that was built
          git show "$SHA:docs/releases/$TAG.md" > "docs/releases/$TAG.md"
          primers-distro/tools/release-notes.sh "$TAG" "$ISO" "$SPLIT" "$IDENTITY" "$SHA" > release-notes.md
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ steps.run.outputs.sha }}
          name: "PRIMERS OS ${{ steps.tag.outputs.tag }}"
          body_path: release-notes.md
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.files.outputs.split == 'true' && format('release/{0}.part*', steps.files.outputs.iso) || format('release/{0}', steps.files.outputs.iso) }}
            release/SHA256SUMS
            release/SHA256SUMS.sig
            release/SHA256SUMS.pem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A fresh machine that has never seen the build downloads the published
  # pre-release and runs the verification commands exactly as the release
  # notes give them.
  verify-release:
    needs: [build, reuse]
    if: ${{ always() && ((needs.build.result == 'success' && contains(needs.build.outputs.tag, '-')) || (needs.reuse.result == 'success' && needs.reuse.outputs.tag != '')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag || needs.reuse.outputs.tag }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Download the release and run the commands from its notes
        shell: bash
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          awk '/^## Download and verify/ {d = 1} d && /^```bash$/ {f = 1; next} f && /^```$/ {f = 0; next} f' notes.md > verify.sh
          echo "Commands from the release notes:"
          cat verify.sh
          grep -q '^cosign verify-blob' verify.sh || { echo "::error::no cosign command in the release notes"; exit 1; }
          mkdir clean && cd clean
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          ls -l
          bash -euo pipefail ../verify.sh 2>&1 | tee ../verify.out
          grep -qx 'Verified OK' ../verify.out || { echo "::error::signature not verified"; exit 1; }
          total=$(wc -l < SHA256SUMS)
          ok=$(grep -c ': OK$' ../verify.out)
          [ "$ok" -eq "$total" ] || { echo "::error::$ok of $total files checked"; exit 1; }
          echo "Verified: signature and all $total checksums, on a machine that did not build the image"
