name: Build and Release PRIMERS OS ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    permissions:
      contents: write
      id-token: write     # Sigstore keyless signing of SHA256SUMS (no key stored anywhere)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space (the build needs ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso mtools gnupg curl

      - name: Check package names
        run: python3 primers-distro/tools/check-packages.py

      - name: Build ISO
        run: sudo PRIMERS_WORK_DIR=/mnt/primers-work ./primers-distro/build.sh

      - name: Checksums (SHA256SUMS)
        id: files
        working-directory: primers-distro
        run: |
          ISO=$(ls *.iso | head -n1)
          SIZE=$(stat -c %s "$ISO")
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"
          echo "ISO size: $SIZE bytes"
          files=("$ISO")
          # GitHub release assets are limited to 2 GiB per file
          if [ "$SIZE" -ge 2000000000 ]; then
            split -b 1900M -d -a 1 "$ISO" "$ISO.part"
            files+=("$ISO".part*)
            echo "split=true" >> "$GITHUB_OUTPUT"
          else
            echo "split=false" >> "$GITHUB_OUTPUT"
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign SHA256SUMS (Sigstore keyless, this workflow's GitHub identity)
        working-directory: primers-distro
        run: |
          cosign sign-blob --yes --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem SHA256SUMS
          # Check the signature the way users will, before anything is published
          cosign verify-blob SHA256SUMS --signature SHA256SUMS.sig --certificate SHA256SUMS.pem \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-iso.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.files.outputs.iso }}
          path: |
            primers-distro/*.iso
            primers-distro/SHA256SUMS*
          compression-level: 0
          retention-days: 14

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ISO: ${{ steps.files.outputs.iso }}
          SPLIT: ${{ steps.files.outputs.split }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing: every release needs notes saying what is tested and what isn't"
            exit 1
          fi
          {
            cat "$notes"
            echo
            echo "## Download and verify"
            echo
            if [ "$SPLIT" = "true" ]; then
              echo "The ISO is larger than GitHub's 2 GiB asset limit, so it is split into parts. Download every part plus \`SHA256SUMS\`, \`SHA256SUMS.sig\` and \`SHA256SUMS.pem\`, then join them:"
              echo
              echo '```bash'
              echo "cat $ISO.part* > $ISO"
              echo '```'
              echo
            fi
            echo "Check the checksums file was signed by this repository's release workflow ([cosign](https://docs.sigstore.dev/cosign/system_config/installation/)):"
            echo
            echo '```bash'
            echo "cosign verify-blob SHA256SUMS --signature SHA256SUMS.sig --certificate SHA256SUMS.pem \\"
            echo "  --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-iso.yml@${GITHUB_REF} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "Then check the ISO:"
            echo
            echo '```bash'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
            echo
            echo "Built from commit \`${GITHUB_SHA}\`."
          } > release-notes.md
          cat release-notes.md

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PRIMERS OS ${{ github.ref_name }}"
          body_path: release-notes.md
          # Tags with a suffix (v1.0.0-rc1) are pre-releases. A final tag only
          # makes a draft: publishing a final release is a deliberate, manual step.
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: ${{ !contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.files.outputs.split == 'true' && format('primers-distro/{0}.part*', steps.files.outputs.iso) || format('primers-distro/{0}', steps.files.outputs.iso) }}
            primers-distro/SHA256SUMS
            primers-distro/SHA256SUMS.sig
            primers-distro/SHA256SUMS.pem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
