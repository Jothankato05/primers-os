name: Build and Release PRIMERS OS ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools isolinux syslinux \
            syslinux-common debootstrap

      - name: Build ISO
        run: |
          cd primers-distro
          chmod +x build.sh clean.sh auto/config auto/build auto/clean
          sudo bash build.sh

      - name: Find ISO file
        id: find_iso
        run: |
          ISO_FILE=$(ls primers-distro/*.iso | head -n 1)
          echo "iso_file=$ISO_FILE" >> $GITHUB_ENV
          echo "iso_name=$(basename $ISO_FILE)" >> $GITHUB_ENV

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.iso_name }}
          path: ${{ env.iso_file }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ env.iso_file }}
          tag_name: "v1.0.0-genesis"
          name: "PRIMERS OS 1.0 Genesis"
          body: |
            ## PRIMERS OS 1.0 Genesis
            
            This is the official build of PRIMERS OS 1.0 Genesis.
            
            **Features:**
            - Base: Ubuntu 22.04 LTS
            - Desktop: Openbox + tint2
            - Included Modules: PRIMERS Brain, AI Engine
            
            **Installation:**
            1. Flash this ISO to a USB drive using Rufus or BalenaEtcher.
            2. Boot from the USB drive.
            3. Follow the on-screen installer (Calamares).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
