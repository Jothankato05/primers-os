<html><head><meta charset="utf-8"><title>Probe test exam</title>

</head><body>
<h1>Probe test exam</h1>

<script>
  fetch("http://localhost:8768/api.json").catch(function () {});

  setTimeout(function () { location.href = "/redirect"; }, 2500);
</script>
